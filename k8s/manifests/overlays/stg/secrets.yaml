# External Secrets Operator reads the catalog credentials from Secrets Manager
# (auto-repair-shop-stg/catalog) and materialises them into the Secret
# catalog-service-secrets consumed by the Deployment and the migrate Job.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: catalog-service-aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # No serviceAccountRef: uses the External Secrets controller's IRSA role.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: catalog-service-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: catalog-service-aws-secretsmanager
    kind: SecretStore
  target:
    name: catalog-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: auto-repair-shop-stg/catalog
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: auto-repair-shop-stg/catalog
        property: POSTGRES_PASSWORD
    - secretKey: POSTGRES_DB
      remoteRef:
        key: auto-repair-shop-stg/catalog
        property: POSTGRES_DB
    - secretKey: JWT_SECRET
      remoteRef:
        key: auto-repair-shop-stg/catalog
        property: JWT_SECRET
    - secretKey: INTERNAL_TOKEN
      remoteRef:
        key: auto-repair-shop-stg/catalog
        property: INTERNAL_TOKEN
