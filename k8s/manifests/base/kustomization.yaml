apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: auto-repair-shop

# The catalog service workload only. Networking is owned by Terraform in
# auto-repair-shop-infra-k8s; the database (RDS) by auto-repair-shop-infra-db.
# All objects carry the catalog-service prefix: every service shares the
# auto-repair-shop namespace.
resources:
  - configmap.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - migrate-job.yaml

images:
  - name: auto-repair-shop-catalog-service
    newTag: dev
