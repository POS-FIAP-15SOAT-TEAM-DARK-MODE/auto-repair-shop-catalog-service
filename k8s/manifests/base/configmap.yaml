apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-service-config
  labels:
    app: catalog-service
# Non-sensitive runtime config. Secret values (POSTGRES_USER/PASSWORD/DB,
# JWT_SECRET, INTERNAL_TOKEN) live in the catalog-service-secrets Secret.
# POSTGRES_HOST and CATALOG_QUEUE_URL are filled in per environment by the
# deploy workflow (RDS endpoint and SQS queue URL).
data:
  POSTGRES_PORT: "5432"
  POSTGRES_SSLMODE: "require"
  AWS_REGION: "us-east-1"
  LOG_LEVEL: "INFO"
  PORT: "8082"
  SEED_ENABLED: "false"
  CATALOG_QUEUE_URL: ""
