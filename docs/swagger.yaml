openapi: 3.0.0
info:
  title: Auto Repair Shop - Catalog Service
  version: 1.0.0
  description: Works (billable services) and supplies (parts with stock). Internal endpoints are not part of this document.
servers:
- url: http://localhost:8082
  description: Local development server
  variables:
    PORT:
      default: '8080'
      description: Port number for the server
security:
- SessionToken: []
paths:
  /v1/works:
    post:
      summary: Register a new Work
      description: Endpoint to create a new work object.
      tags:
      - Work
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkRequest'
      responses:
        '201':
          description: Successful created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkResponse'
        '500':
          description: Internal Server Error
        '400':
          description: Invalid Body Content
    get:
      summary: List Works
      description: List registered works with pagination and optional status filter.
      tags:
      - Work
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          format: int64
          default: 1
          minimum: 1
        description: Page number (1-based).
      - in: query
        name: pageSize
        schema:
          type: integer
          format: int64
          default: 10
          minimum: 1
        description: Number of items per page.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        description: Filter works by status.
      responses:
        '200':
          description: Successful list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListWorksResponse'
        '500':
          description: Internal Server Error
  /v1/works/{id}:
    put:
      summary: Update an existing Work
      description: Endpoint to edit an existing work object.
      tags:
      - Work
      parameters:
      - in: path
        required: true
        name: id
        schema:
          type: string
        description: Id of work to be updated.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkRequest'
      responses:
        '200':
          description: Successful updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWorkResponse'
        '500':
          description: Internal Server Error
        '400':
          description: Invalid Body Content
    delete:
      summary: Delete a Work
      description: Deletes a work by its id.
      tags:
      - Work
      parameters:
      - in: path
        required: true
        name: id
        schema:
          type: string
        description: Id of work to be deleted.
      responses:
        '204':
          description: Successful deleted
        '500':
          description: Internal Server Error
  /v1/supplies:
    post:
      summary: Create a supply
      description: Creates a new supply with name, description, unit price and stock quantity.
      tags:
      - Supply
      security:
      - SessionToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplyRequest'
      responses:
        '201':
          description: Supply created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplyResponse'
        '400':
          description: Invalid request body or validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 400
                error: invalid request body
        '422':
          description: Business rule violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 422
                error: data violates business constraints
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 500
                error: Internal Server Error
    get:
      summary: List supplies
      description: Returns a paginated list of supplies with optional status filter.
      tags:
      - Supply
      security:
      - SessionToken: []
      parameters:
      - in: query
        name: page
        schema:
          type: integer
          format: int64
          default: 1
          minimum: 1
        description: Page number (1-based).
      - in: query
        name: pageSize
        schema:
          type: integer
          format: int64
          default: 10
          minimum: 1
        description: Number of items per page.
      - in: query
        name: version
        schema:
          type: number
        description: Filter supplies by version.
      responses:
        '200':
          description: Supplies listed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSuppliesResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 500
                error: Internal Server Error
  /v1/supplies/{id}:
    put:
      summary: Update a supply
      description: Updates an existing supply by ID.
      tags:
      - Supply
      security:
      - SessionToken: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: Supply UUID
        example: d290f1ee-6c54-4b01-90e6-d701748f0851
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplyRequest'
      responses:
        '200':
          description: Supply updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplyResponse'
        '400':
          description: Invalid request body or validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 400
                error: invalid request body
        '422':
          description: Business rule violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 422
                error: data violates business constraints
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 500
                error: Internal Server Error
    delete:
      summary: Delete a supply
      description: Removes a supply by ID. Returns 204 on success.
      tags:
      - Supply
      security:
      - SessionToken: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: Supply UUID
        example: d290f1ee-6c54-4b01-90e6-d701748f0851
      responses:
        '204':
          description: Supply deleted successfully
        '400':
          description: Missing or invalid supply ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 400
                error: invalid supply id
        '404':
          description: Supply not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                code: 500
                error: Internal Server Error
components:
  securitySchemes:
    SessionToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserRegisterRequest:
      type: object
      required:
      - name
      - email
      - password
      - confirmPassword
      properties:
        name:
          type: string
          description: Full name of the user
        email:
          type: string
          format: email
          description: User email address
        password:
          type: string
          format: password
          description: User password
        confirmPassword:
          type: string
          format: password
          description: Password confirmation (must match password)
    UserLoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          description: User email address
        password:
          type: string
          format: password
          description: User password
    UpdateUserRoleRequest:
      type: object
      required:
      - role
      properties:
        role:
          type: string
          description: New role to be assigned to the user
          enum:
          - ADMIN
          - ATTENDANT
          - MECHANIC
          - CUSTOMER
          example: MECHANIC
    UserLoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token
        expires_in:
          type: integer
          description: Token expiration duration
        user:
          $ref: '#/components/schemas/UserResponse'
    UserResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Unique user identifier
        name:
          type: string
          description: Full name of the user
        email:
          type: string
          format: email
          description: User email address
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: integer
          description: HTTP status code
        errors:
          type: array
          items:
            type: string
          description: List of validation/business error messages
    WorkExecutionTimeResponse:
      type: object
      properties:
        workId:
          type: string
          format: uuid
          description: Work identifier
        workName:
          type: string
          description: Name of the billable service
        averageExecutionTimeHours:
          type: number
          format: double
          description: Average time in hours for this work to go from IN_PROGRESS to COMPLETED across all service orders
    CreateCustomerRequest:
      type: object
      required:
      - name
      - email
      - password
      - type
      - document
      - phone
      properties:
        name:
          type: string
          example: João Silva
        email:
          type: string
          format: email
          example: joao@example.com
        password:
          type: string
          minLength: 8
          example: Secret@123
        type:
          type: string
          enum:
          - INDIVIDUAL
          - COMPANY
          example: INDIVIDUAL
        document:
          type: string
          description: CPF (e.g. 111.444.777-35) for INDIVIDUAL or CNPJ (e.g. 11.222.333/0001-81) for COMPANY. Alphanumeric
            CNPJ is also accepted (e.g. AB.CDE.FGH/0001-95).
          example: 111.444.777-35
        companyName:
          type: string
          description: Required when type is COMPANY.
          example: Empresa SA
        phone:
          type: string
          example: '11999999999'
    CustomerResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        name:
          type: string
          example: João Silva
        email:
          type: string
          example: joao@example.com
        type:
          type: string
          enum:
          - INDIVIDUAL
          - COMPANY
          example: INDIVIDUAL
        document:
          type: string
          description: Sanitized CPF (11 digits) for INDIVIDUAL or CNPJ (14 chars) for COMPANY
          example: '11144477735'
        company_name:
          type: string
          example: ''
        phone:
          type: string
          example: '11999999999'
    UpdateCustomerRequest:
      type: object
      description: All fields are optional. Only provided fields are updated.
      properties:
        name:
          type: string
          description: Full name (min 3 chars, letters and spaces only)
          example: Novo Nome
        email:
          type: string
          format: email
          example: novo@example.com
        phone:
          type: string
          example: '11888888888'
    CreateWorkRequest:
      type: object
      properties:
        name:
          type: string
          description: Work name
          example: Alinhamento
        description:
          type: string
          description: Description of the work being provided
          example: Alinhamento completo das rodas do veículo
        price:
          type: string
          description: Price as string, decimal allowed, no thousands separator
          example: '199.00'
        status:
          type: string
          description: Status of the work. Must be a valid work status enum string.
          example: ACTIVE
      required:
      - name
      - description
      - price
      - status
    CreateWorkResponse:
      type: object
      properties:
        id:
          type: string
          description: Work ID
          example: 272e933f-273e-4ef7-a38d-2ab1dd8c234c
        name:
          type: string
          description: Work name
          example: Alinhamento
        description:
          type: string
          description: Description of the work being provided
          example: Alinhamento completo das rodas do veículo
        price:
          type: string
          description: Price as string, decimal allowed, no thousands separator
          example: '199.00'
        status:
          type: string
          description: Status of the work. Must be a valid work status enum string.
          example: ACTIVE
      required:
      - id
      - name
      - description
      - price
      - status
    ListWorksResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CreateWorkResponse'
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int64
        page:
          type: integer
          format: int64
      required:
      - items
      - totalItems
      - totalPages
      - pageSize
      - page
    WorkStatusEntry:
      type: object
      description: A single status transition for one work.
      properties:
        previous_status:
          type: string
          example: NEW
        new_status:
          type: string
          example: IN_PROGRESS
        created_at:
          type: string
          format: date-time
          example: '2026-04-16T14:34:37.026Z'
      required:
      - previous_status
      - new_status
      - created_at
    WorkTransitionGroup:
      type: object
      description: Full status history for a single work, grouped by work_id.
      properties:
        work_id:
          type: string
          format: uuid
          example: eeeeeeee-eeee-eeee-eeee-eeeeeeeeeeee
        status:
          type: array
          description: All status transitions for this work, ordered by created_at ascending.
          items:
            $ref: '#/components/schemas/WorkStatusEntry'
      required:
      - work_id
      - status
    WorkOrderHistoryEntry:
      type: object
      properties:
        previous_status:
          type: string
          example: RECEIVED
        new_status:
          type: string
          example: IN_DIAGNOSIS
        created_at:
          type: string
          format: date-time
          example: '2026-04-05T12:34:56Z'
        work_transitions:
          type: array
          description: Present only when `new_status` is `IN_PROGRESS`. Contains the full status history for each work attached
            to the service order, grouped by `work_id`.
          items:
            $ref: '#/components/schemas/WorkTransitionGroup'
      required:
      - previous_status
      - new_status
      - created_at
    VehicleRequest:
      type: object
      required:
      - brand
      - licensePlate
      - customerId
      - model
      - year
      properties:
        brand:
          type: string
          example: chevrolet
        licensePlate:
          type: string
          example: aaa-2a22
        customerId:
          type: string
          format: uuid
          example: b8415e84-730a-4624-a1c3-74cf59b95d6d
        model:
          type: string
          example: onix
        year:
          type: integer
          example: 2019
    VehicleResponse:
      type: object
      required:
      - id
      - licensePlate
      - brandModel
      - year
      - customerId
      properties:
        id:
          type: string
          format: uuid
          example: 55160da4-d243-4920-9426-5ce97aefb2fc
        licensePlate:
          type: string
          example: AAA2A22
        brandModel:
          type: string
          example: chevrolet - onix
        year:
          type: integer
          example: 2019
        customerId:
          type: string
          format: uuid
          example: b8415e84-730a-4624-a1c3-74cf59b95d6d
    ListVehiclesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VehicleResponse'
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int64
        page:
          type: integer
          format: int64
      required:
      - items
      - totalItems
      - totalPages
      - pageSize
      - page
    SupplyRequest:
      type: object
      required:
      - name
      - description
      - unitPrice
      - stockQuantity
      properties:
        name:
          type: string
          minLength: 3
          description: Supply name (min 3 characters)
          example: Brake Pad
        description:
          type: string
          minLength: 10
          description: Supply description (min 10 characters)
          example: High performance brake pad
        unitPrice:
          type: string
          description: Unit price as decimal string
          example: '49.99'
        stockQuantity:
          type: integer
          minimum: 0
          description: Stock quantity (must be >= 0)
          example: 10
        version:
          type: integer
          minimum: 0
          description: Optimistic lock version
          example: 1
    SupplyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: Supply unique identifier
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        name:
          type: string
          example: Brake Pad
        description:
          type: string
          example: High performance brake pad
        unit_price:
          type: string
          description: Unit price as decimal string
          example: '49.99'
        stock_quantity:
          type: integer
          example: 10
        version:
          type: integer
          example: 1
    ListSuppliesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SupplyResponse'
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int64
        page:
          type: integer
          format: int64
      required:
      - items
      - totalItems
      - totalPages
      - pageSize
      - page
    CreateServiceOrderRequest:
      type: object
      required:
      - client
      - vehicle
      properties:
        client:
          type: string
          description: ID of the customer/client requesting the service
        vehicle:
          type: string
          description: ID of the vehicle for the service order
    CreateServiceOrderResponse:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          description: Unique identifier for the service order
        status:
          type: string
          description: Service order status (e.g. RECEIVED, IN_DIAGNOSIS, etc)
    ServiceOrderStatusResponse:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the service order
        status:
          type: string
          description: Service order status (e.g. RECEIVED, IN_DIAGNOSIS, etc)
    ServiceOrderVehicleResponse:
      type: object
      required:
      - id
      - licensePlate
      - brandModel
      - year
      properties:
        id:
          type: string
        licensePlate:
          type: string
        brandModel:
          type: string
        year:
          type: integer
    ServiceOrderSupplyResponse:
      type: object
      required:
      - id
      - name
      - description
      - price
      - version
      - amount
      properties:
        id:
          type: string
          description: Supply identifier
        name:
          type: string
          description: Supply name
        description:
          type: string
          description: Supply description
        price:
          type: string
          description: Unit price used in this service order line item
          example: '49.99'
        version:
          type: integer
          description: Optimistic lock version
        amount:
          type: integer
          description: Quantity linked to this service order
    ListServiceOrderSuppliesResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceOrderSupplyResponse'
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int64
        page:
          type: integer
          format: int64
      required:
      - items
      - totalItems
      - totalPages
      - pageSize
      - page
    ServiceOrderListItemResponse:
      type: object
      properties:
        id:
          type: string
        status:
          type: string
        totalValue:
          type: number
          format: float
        customer:
          $ref: '#/components/schemas/CustomerResponse'
        vehicle:
          $ref: '#/components/schemas/ServiceOrderVehicleResponse'
    ListServiceOrdersResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ServiceOrderListItemResponse'
        totalItems:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int64
        page:
          type: integer
          format: int64
      required:
      - items
      - totalItems
      - totalPages
      - pageSize
      - page
    AddServiceToServiceOrderRequest:
      type: object
      required:
      - services
      properties:
        services:
          type: array
          items:
            type: string
            description: ID of the service to add to the service order
    AddSuppliesToServiceOrderRequest:
      type: object
      required:
      - supplies
      properties:
        supplies:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: ID of the supply to add to the service order
              amount:
                type: integer
                description: Amount of supplies to add
    ServiceOrderDetails:
      type: object
      required:
      - id
      - status
      - totalValue
      - works
      - supplies
      properties:
        id:
          type: string
          example: 01KQ2ZNRQQZRQ480K7HEB8YH70
        status:
          type: string
          example: IN_PROGRESS
        totalValue:
          type: number
          example: 10.5
        customer:
          $ref: '#/components/schemas/CustomerResponse'
        vehicle:
          $ref: '#/components/schemas/ServiceOrderVehicleResponse'
        works:
          type: array
          items:
            $ref: '#/components/schemas/CreateWorkResponse'
        supplies:
          type: array
          items:
            $ref: '#/components/schemas/ServiceOrderSupplyResponse'
