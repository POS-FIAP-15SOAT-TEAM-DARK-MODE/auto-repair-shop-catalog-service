name: auto-repair-shop-catalog

services:
  app:
    build: .
    ports:
      - "8082:8082"
    env_file: .env
    environment:
      PORT: "8082"
      POSTGRES_HOST: db
      SEED_ENABLED: "true"
      CATALOG_QUEUE_URL: http://ministack:4566/000000000000/auto-repair-shop-local-catalog-queue
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      aws-init:
        condition: service_completed_successfully
    networks: [backend]

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-catalog}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-catalog}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  migrate:
    image: migrate/migrate:v4.17.1
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-catalog}?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  ministack:
    image: ministackorg/ministack
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  aws-init:
    image: amazon/aws-cli
    entrypoint: ["/bin/sh", "/init/init-aws.sh"]
    volumes:
      - ./local:/init:ro
    environment:
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    depends_on:
      ministack:
        condition: service_healthy
    networks: [backend]

networks:
  backend:
